[package]
name = "rust-codecs-core"
version = "0.1.0"
edition = "2021"

[dependencies]
compcol = { version = "0.6", default-features = false, features = ["std"] }
base64 = { version = "0.22", optional = true }

[features]
identity = []
rot13 = []
base64 = ["dep:base64"]

[lib]
name = "rust_codecs_core"
path = "src/lib.rs"
