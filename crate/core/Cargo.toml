[package]
name = "rust-codecs-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = { version = "0.22", optional = true, default-features = false }
json-escape = { git = "https://github.com/olpa/json-escape", branch = "feat/escape-bytes-try2", optional = true }
embedded-io = { version = "0.7.1", optional = true, default-features = false }

[features]
default = ["std"]
alloc = []
std = ["alloc"]
rot13 = []
base64 = ["dep:base64"]
json = ["dep:json-escape"]
embedded-io = ["dep:embedded-io"]
# Exposes `sources_and_sinks::shared_io::test_support` outside this
# crate, for a third-party `Source`/`Sink` backend's own test suite.
test-support = []

[lib]
name = "rust_codecs_core"
path = "src/lib.rs"
